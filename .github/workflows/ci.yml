name: ServiceOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-verify:
    name: Backend Typecheck, Unit, E2E & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: serviceops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/serviceops_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_serviceops_minimum_32_characters
      JWT_REFRESH_SECRET: ci_refresh_secret_serviceops_minimum_32_characters
      COOKIE_SECRET: ci_cookie_secret_serviceops
      REDIS_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Sync schema & seed PostgreSQL
        working-directory: backend
        run: |
          npx prisma db push --force-reset
          npx prisma generate
          npx ts-node prisma/seed.ts
          npx ts-node prisma/seed-extended.ts

      - name: TypeScript type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Jest unit tests
        working-directory: backend
        run: npm test

      - name: Run Supertest E2E & OWASP tests
        working-directory: backend
        run: npm run test:e2e

      - name: Production build
        working-directory: backend
        run: npm run build

  frontend-verify:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build

