worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  # Security Headers (TLS/Reverse-Proxy Layer)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  upstream serviceops_backend {
    server backend:4000;
  }

  upstream serviceops_frontend {
    server frontend:3000;
  }

  # HTTP entrypoint (proxies cleanly in container networks; enable HTTPS server block below when TLS certs are mounted)
  server {
    listen 80;
    server_name _;

    # Backend REST API
    location /api/ {
      proxy_pass http://serviceops_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO Real-Time WebSocket Upgrade
    location /socket.io/ {
      proxy_pass http://serviceops_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
    }

    # Next.js Frontend App Router
    location / {
      proxy_pass http://serviceops_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Production HTTPS TLS Server Block (mount certs at /etc/nginx/certs/fullchain.pem & privkey.pem)
  # server {
  #   listen 443 ssl http2;
  #   server_name serviceops.enterprise.local;
  #   ssl_certificate /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   include /etc/nginx/conf.d/locations.conf;
  # }
}

