<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Radiant Copper Gradient for Top Isometric Facet -->
    <linearGradient id="topCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5955a" />
      <stop offset="100%" stop-color="#cc5220" />
    </linearGradient>
    
    <!-- Deep Obsidian Shading -->
    <linearGradient id="leftObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241f1a" />
      <stop offset="100%" stop-color="#14110e" />
    </linearGradient>

    <!-- Rich Terracotta / Warm Burnished Copper -->
    <linearGradient id="rightCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e431f" />
      <stop offset="100%" stop-color="#782f12" />
    </linearGradient>

    <!-- Soft Drop Shadow for the Isometric Node -->
    <filter id="nodeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14110e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- High-Contrast Clean White Squircle Base with Warm Micro-Border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#ffffff" stroke="#ded8cc" stroke-width="1.2" />

  <!-- 3D Isometric ServiceOps Node Group -->
  <g filter="url(#nodeShadow)">
    <!-- Left Facet (Obsidian Server Core) -->
    <polygon points="7.5,11.2 16,16 16,25.5 7.5,20.7" fill="url(#leftObsidian)" />
    <!-- Server Slot Insets on Left -->
    <line x1="10" y1="15.8" x2="13.5" y2="17.8" stroke="#3d362e" stroke-width="1.2" stroke-linecap="round" />
    <line x1="10" y1="19" x2="13.5" y2="21" stroke="#3d362e" stroke-width="1.2" stroke-linecap="round" />

    <!-- Right Facet (Burnished Copper Engine) -->
    <polygon points="16,16 24.5,11.2 24.5,20.7 16,25.5" fill="url(#rightCopper)" />
    <!-- Server Trace Accents on Right -->
    <line x1="18.5" y1="17.8" x2="22" y2="15.8" stroke="#bd5830" stroke-width="1.2" stroke-linecap="round" />
    <line x1="18.5" y1="21" x2="22" y2="19" stroke="#bd5830" stroke-width="1.2" stroke-linecap="round" />

    <!-- Top Facet (Radiant Copper Cap) -->
    <polygon points="16,6.5 24.5,11.2 16,16 7.5,11.2" fill="url(#topCopper)" />

    <!-- Top Core Diamond Highlight -->
    <polygon points="16,9.2 20.2,11.5 16,13.8 11.8,11.5" fill="#ffffff" fill-opacity="0.36" />
  </g>

  <!-- Operational Green Beacon Pulse (System Active & Healthy) -->
  <circle cx="24.5" cy="8.5" r="4.2" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.5" />
  <circle cx="24.5" cy="8.5" r="2.8" fill="#10b981" />
  <circle cx="24.5" cy="8.5" r="1.1" fill="#ffffff" />
</svg>